name: Bebiio Otomatik Fiyat Motoru

on:
  schedule:
    # Her 30 dakikada bir motoru ateşler
    - cron: '*/30 * * * *'
  workflow_dispatch: 
    # GitHub üzerinden istediğin an manuel tıklayıp çalıştırman için buton koyar

jobs:
  bebiio-tarama:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v3

      - name: Python 3.10 Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Gerekli Paketleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: 🚀 Motoru Ateşle
        run: python scraper.py