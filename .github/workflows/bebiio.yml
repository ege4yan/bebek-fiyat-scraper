name: Bebiio Otomatik Fiyat Motoru

on:
  schedule:
    # Her 30 dakikada bir motoru ateşler
    - cron: '*/30 * * * *'
  workflow_dispatch:
    # GitHub üzerinden istediğin an manuel tıklayıp çalıştırman için buton koyar

jobs:
  bebiio-tarama:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # sirali mod uzun surebiliyor (~45dk), varsayilan 6 saatlik sinira takilmasin diye makul bir ust sinir
    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v3

      - name: Python 3.10 Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Gerekli Paketleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: 🚀 Motoru Ateşle (tüm siteler sırayla)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python scraper.py

      - name: 🔍 Debug Görüntülerini Yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-output
          path: debug_output/
          if-no-files-found: ignore
          retention-days: 3