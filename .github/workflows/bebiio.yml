name: Bebiio Otomatik Fiyat Motoru

on:
  schedule:
    # Her 30 dakikada bir motoru ateşler
    - cron: '*/30 * * * *'
  workflow_dispatch:
    # GitHub üzerinden istediğin an manuel tıklayıp çalıştırman için buton koyar

jobs:
  bebiio-tarama:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # bir site hata verse bile digerleri calismaya devam etsin
      matrix:
        # Hepsiburada bilerek matrix'e dahil edilmedi: GitHub Actions'ta
        # (X-server olmadigi icin) hep hata veriyor, bosuna bir job harcamasin.
        # Yerelde tam taramak istersen: python scraper.py hepsi
        site: [amazon, trendyol, n11, ebebek, pazarama, idefix, pttavm]
    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v3

      - name: Python 3.10 Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Gerekli Paketleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: 🚀 ${{ matrix.site }} Taranıyor
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python scraper.py ${{ matrix.site }}

      - name: 🔍 Debug Görüntülerini Yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-output-${{ matrix.site }}
          path: debug_output/
          if-no-files-found: ignore
          retention-days: 3