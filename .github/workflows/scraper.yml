name: Gunluk Fiyat Guncelleme

on:
  schedule:
    - cron: '30 * * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sanal Ekran (Xvfb) Kurulumu
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Kutuphaneleri Yukle
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi psycopg2-binary playwright bs4 pandas tf-playwright-stealth
          playwright install chromium

      - name: Motorlari Calistir
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          xvfb-run python scraper.py