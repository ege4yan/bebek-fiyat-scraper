name: Gunluk Fiyat Guncelleme

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kutuphaneleri Yukle
        run: |
          python -m pip install --upgrade pip
          pip install playwright bs4 pandas playwright-stealth supabase
          playwright install chromium

      - name: Motorlari Calistir
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python trendyol_motoru.py
          python n11_motoru.py
          python hepsiburada_motoru.py
          python amazon_motoru.py