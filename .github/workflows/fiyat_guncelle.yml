name: Günlük Fiyat Güncelleme

on:
  schedule:
    # Şimdilik test için 15 dakikada bir çalışacak
    - cron: '*/15 * * * *' 
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    - name: Kodu Çek (Checkout)
      uses: actions/checkout@v4

    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Kütüphaneleri Yükle
      run: |
        python -m pip install --upgrade pip
        pip install playwright bs4 pandas playwright-stealth supabase
        playwright install chromium

    - name: Motorları Çalıştır
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        python trendyol_motoru.py
        python n11_motoru.py
        python hepsiburada_motoru.py
        python amazon_motoru.py