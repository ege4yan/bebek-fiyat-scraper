name: Gunluk Fiyat Guncelleme

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kutuphaneleri Yukle
        run: |
          python -m pip install --upgrade pip
          pip install playwright bs4 pandas psycopg2-binary
          playwright install chromium

      - name: Motorlari Calistir
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python akakce_motoru.py 
          # Üstteki dosya adını (akakce_motoru.py) kendi Python dosyanın adıyla değiştirmeyi unutma