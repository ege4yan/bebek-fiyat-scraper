name: Günlük Fiyat Güncelleme

on:
  schedule:
    # Her gece Türkiye saati ile yaklaşık 06:00'da çalışır (UTC 03:00)
    - cron: '0 3 * * *' 
  workflow_dispatch: # GitHub üzerinden manuel tetikleme butonu ekler

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    - name: Kodu Çek (Checkout)
      uses: actions/checkout@v3

    - name: Python Kurulumu
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Kütüphaneleri Yükle
      run: |
        python -m pip install --upgrade pip
        pip install playwright bs4 pandas openpyxl
        playwright install chromium

    - name: Motorları Çalıştır
      run: |
        python trendyol_motoru.py
        python n11_motoru.py

    - name: Excel Dosyalarını Kaydet (Artifacts)
      uses: actions/upload-artifact@v3
      with:
        name: Guncel-Fiyat-Tabloları
        path: ./*.xlsx